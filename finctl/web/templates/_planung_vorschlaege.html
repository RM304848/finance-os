   Suche nichts zu suchen hat. #}

  {% if meldung %}<tr><td class="muted">{{ meldung }}</td></tr>{% endif %}
  {% for b in kandidaten %}{% include "_planung_buchungszeile.html" %}{% endfor %}
</table>
